# kitty.conf (lean). Everything omitted uses kitty defaults.
# Full reference of every option: https://sw.kovidgoyal.net/kitty/conf/

# Font (Nerd Font, required by the powerlevel10k prompt)
font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Layout and tab bar
enabled_layouts  grid
tab_bar_style    powerline

# Window
background_opacity 1.0

# Theme. This block is managed by `kitten themes`; edit via that command.
# BEGIN_KITTY_THEME
# Base2Tone Evening Dark
include current-theme.conf
# END_KITTY_THEME
