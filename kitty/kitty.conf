# kitty.conf (lean). Everything omitted uses kitty defaults.
# Full reference of every option: https://sw.kovidgoyal.net/kitty/conf/

# Layout and tab bar
enabled_layouts  grid
tab_bar_style    powerline

# Window
background_opacity 1.0

# Theme. This block is managed by `kitten themes`; edit via that command.
# BEGIN_KITTY_THEME
# Base2Tone Evening Dark
include current-theme.conf
# END_KITTY_THEME
